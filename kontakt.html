<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesham Malik | Kontakt</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --card-bg: #ffffff;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-color: #000000;
            --border-color: #e5e5e5;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: Georgia, 'Times New Roman', serif;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: rgba(252, 252, 252, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            letter-spacing: 0.25rem;
            text-transform: uppercase;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 300;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.85rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-color);
        }

        .page-header {
            padding: 5rem 2rem 3rem;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem 6rem;
            text-align: center;
        }

        /* Painting Frame */
        .artwork-frame {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 0 auto 3rem;
            background-color: #f0f0f0;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Email Display Box */
        .email-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            margin-bottom: 4rem;
        }

        .email-label {
            font-size: 0.85rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .email-link {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.15rem;
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 0.2rem;
            transition: opacity 0.3s;
        }

        .email-link:hover {
            opacity: 0.6;
        }

        /* Institutional Contact Form */
        .contact-form {
            text-align: left;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem;
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #000000;
            background-color: #ffffff;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.8;
        }

        footer {
            padding: 2.5rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #777777;
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem 2rem;
            }
            nav a {
                margin: 0 0.75rem;
            }
            .page-header h1 {
                font-size: 1.8rem;
            }
            .email-link {
                font-size: 1.2rem;
            }
            .contact-form {
                padding: 1.8rem;
            }
            footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Hesham Malik</a>
        <nav>
            <a href="index.html">Domů</a>
            <a href="umelec.html">Umělec</a>
            <a href="umeni.html">Umění</a>
            <a href="projekty.html">Projekty</a>
            <a href="vystavy.html">Výstavy</a>
            <a href="kontakt.html" class="active">Kontakt</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>NAPIŠTE MI E-MAIL</h1>
        </section>

        <section class="contact-container">
            
            <!-- Featured Painting -->
            <div class="artwork-frame">
                <img src="assets/images/contact-artwork.jpg" alt="Hesham Malik - Contact Artwork" loading="lazy">
            </div>

            <!-- Email Highlight Box -->
            <div class="email-box">
                <div class="email-label">Oficiální E-mail</div>
                <a href="mailto:hm@heshammalik.eu" class="email-link">hm@heshammalik.eu</a>
            </div>

            <!-- Direct Contact Form -->
            <form class="contact-form" action="https://formspree.io/f/xbjnqkyv" method="POST">
                <div class="form-title">Přímý kontakt &bull; Ateliér</div>
                
                <div class="form-group">
                    <label for="name">Jméno a příjmení / Instituce</label>
                    <input type="text" id="name" name="name" required placeholder="Vaše jméno nebo název galerie">
                </div>

                <div class="form-group">
                    <label for="email">E-mailová adresa</label>
                    <input type="email" id="email" name="email" required placeholder="prijmeni@domain.cz">
                </div>

                <div class="form-group">
                    <label for="subject">Předmět</label>
                    <input type="text" id="subject" name="subject" required placeholder="Dotaz na dílo / Kurátorský záměr / Výstava">
                </div>

                <div class="form-group">
                    <label for="message">Zpráva</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Napište Vaši zprávu..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Odeslat zprávu &rarr;</button>
            </form>

        </section>
    </main>

    <footer>
        <p>&copy; Hesham Malik. Všechna práva vyhrazena.</p>
        <p>Prague &bull; Brussels &bull; Global</p>
    </footer>

</body>
</html>
